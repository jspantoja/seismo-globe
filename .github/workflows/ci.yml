name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Compilación de producción
        run: npm run build
